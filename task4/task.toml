artifacts = ["/app/schedule.json"]

[task]
name = "dynamo/exec-calendar-triage"
description = "Book a week of meeting requests against partly-full calendars across three time zones, applying a scheduling policy with travel buffers, protected lunch and daily load caps."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"
subcategory = "Personal Assistant Productivity"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "This is the work of an executive assistant or operations coordinator: forty meeting requests, nine people across three time zones, calendars already carrying forty-five standing commitments and five PTO days, and a booking policy with six interacting conditions. The difficulty is not volume. Forty requests would be a morning's work if the conditions were independent; what makes it hard is that they interact, and that the interaction is invisible until the whole week is assembled. A slot that satisfies working hours can still fail on travel, a slot that satisfies travel can still breach the daily cap, and every booking narrows the space for the ones considered after it, so a local decision that looks right can only be judged against the whole week. Every figure below is the number of the forty requests that wrong implementation still gets right, measured by running it against the real verifier on the shipped data. Ignoring working hours: 12. Ignoring PTO: 18. Considering the requests in catalogue order instead of the policy's order: 21. Dropping travel buffers between engagements at different sites: 24. Ignoring the daily load cap: 26. Ordering by priority but skipping the tie-break on attendee count: 31. Comparing the daily cap with >= instead of >: 35. Forgetting that people travel in from and home to their own home site at the ends of the day: 38. Ignoring the protected lunch, or applying its priority-1 exemption to priority 2 instead: 39. None of these throw an error or produce an obviously broken week; they produce a plausible schedule that is wrong in a few places, and the last four are wrong in only a handful. Grading is all-or-nothing across all forty requests, so every one of them scores 0. Nineteen of the forty genuinely cannot be placed and must be declined, so an agent also has to distinguish a request that does not fit from one it merely failed to fit. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Convert everything to minutes in UTC using each person's stored offset -- local midnight of day d sits at d*1440 minus the offset -- so no time zone database is involved and the arithmetic is exact. Build each person's calendar from their standing commitments, tagged with location. Sort the requests the way the policy states: priority ascending, then required-attendee count descending, then id ascending. For each in turn, walk the days of its window in order and the 15-minute grid within each day in order, and take the first start at which every required attendee clears all six conditions -- not on PTO, inside their working hours for that day in their own local time, no overlap, enough travel time to the engagements immediately before and after and to and from their home site at the ends of the day, no collision with protected lunch unless the meeting is priority 1, and the daily cap not breached. Because the scan order is total there is no tie to break and the choice is unique. Fix the slot, then admit each optional attendee who independently clears the same six conditions, and commit the booking so it constrains everything considered afterwards. If no slot in the window works, decline. The reference solver is pure standard-library Python, uses no randomness, and runs in about 0.05 s, so the binding constraint is the reasoning rather than the clock and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "Ground truth is the schedule the policy produces, held in tests/expected.json, which is overlaid only at verification time and never copied into the agent image. The comparison is exact and there is no tolerance to calibrate, which is defensible here only because the policy determines exactly one schedule: two independently written implementations of it -- a different author style, interval scans versus explicit minute arithmetic -- agree on all forty requests, and an independent constraint checker that shares no code with either confirms the result violates none of the six conditions. The verifier also pins the output schema strictly: one entry per request in request order, exact field set, status drawn from its two permitted values, day and start_utc matching the documented patterns when scheduled and empty strings when declined, and attendees a sorted list of unique strings. It reads the result with O_NOFOLLOW so a symlinked output path cannot alias another file. Grading is all-or-nothing across all forty requests. Every rule in the policy was confirmed to do real work by mutation testing: altering any one of the ten -- moving the lunch exemption from priority 1 to priority 2, comparing the daily cap with >= instead of >, dropping travel buffers, dropping home-site travel, ignoring working hours, ignoring the cap, ignoring lunch, ignoring PTO, or replacing the ordering with priority-only or catalogue order -- changes the resulting schedule, so no rule is decorative and a solver cannot pass while getting one wrong. Measured against the real verifier: oracle 1.0 in 0.05 s and stable across re-runs, nop 0, and 0 for each of the ten wrong-policy implementations above plus a one-request-wrong near-miss, reversed attendee lists, a reversed array, a dropped entry, +00:00 instead of Z, declining everything, and a symlinked output path."

