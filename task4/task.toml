[task]
name = "dynamo/exec-calendar-triage"
description = "Book a week of meeting requests against partly-full calendars across three time zones, applying a scheduling policy with travel buffers, protected lunch and daily load caps."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"
subcategory = "Personal Assistant Productivity"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 3.0
difficulty_explanation = "This is the work of an executive assistant or operations coordinator: forty meeting requests, nine people across three time zones, calendars already carrying forty-five standing commitments and five PTO days, and a booking policy with six per-person conditions plus a rule about which slot a request takes. The trap is that rule. The obvious reading of a scheduling policy is first-fit -- give each request the earliest slot that works -- and here that is wrong, because an early slot can consume the only window a later request had. The policy instead weighs a request's first six feasible slots by how many of the next eight requests still fit behind each one. An agent that writes the straightforward greedy solver gets 31 of the 40 requests right and fails, which is the point: the difficulty is not in reading the spec but in noticing that a forward pass does not implement it. Every figure here is the number of the forty requests that wrong implementation still gets right, measured against the real verifier on the shipped data. Ignoring working hours: 12. Ignoring PTO, or considering the requests in catalogue order instead of the policy's order: 19. Dropping travel buffers between engagements at different sites: 20. Ignoring the daily load cap: 25. Ordering by priority but skipping the tie-break on attendee count: 28. Taking the earliest feasible slot instead of weighing candidates, or comparing the daily cap with >= instead of >: 31. Forgetting that people travel in from and home to their own home site at the ends of the day, ignoring the protected lunch, or applying its priority-1 exemption to priority 2 instead: 38. None of these throw an error or produce an obviously broken week; each produces a plausible schedule that is wrong in a few places. Grading is all-or-nothing across all forty requests, so every one of them scores 0. Eighteen of the forty genuinely cannot be placed and must be declined, so an agent also has to distinguish a request that does not fit from one it merely failed to fit. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Convert everything to minutes in UTC using each person's stored offset -- local midnight of day d sits at d*1440 minus the offset -- so no time zone database is involved and the arithmetic is exact. Build each person's calendar from their standing commitments, tagged with location. Sort the requests as the policy states: priority ascending, then required-attendee count descending, then id ascending. The feasibility test for one person at one slot is six conditions -- not on PTO, inside their working hours for that day in their own local time, no overlap, enough travel time to the engagements immediately before and after and to and from their home site at the ends of the day, no collision with protected lunch unless the meeting is priority 1, and the daily cap not breached. The step that a forward pass gets wrong is slot choice. For each request, enumerate its first six feasible slots in day-then-time order; for each, clone the calendar state, tentatively book the request with the attendees it would really have, then place the next eight requests greedily into their earliest feasible slots and count how many fit; keep the candidate with the highest count, earliest breaking ties. Commit that booking and move on. Cloning is what makes this tractable -- the trial rollouts must not touch the real calendars. Because the candidate list, the rollout depth and the tie-break are all fixed, the result is unique. The reference solver is pure standard-library Python, uses no randomness, and runs in about 0.12 s, so the binding constraint is the reasoning rather than the clock and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "Ground truth is the schedule the policy produces, held in tests/expected.json, which is overlaid only at verification time and never copied into the agent image. The comparison is exact and there is no tolerance to calibrate, which is defensible here only because the policy determines exactly one schedule: two independently written implementations of it -- a different author style, interval scans versus explicit minute arithmetic -- agree on all forty requests, and an independent constraint checker that shares no code with either confirms the result violates none of the six conditions. The verifier also pins the output schema strictly: one entry per request in request order, exact field set, status drawn from its two permitted values, day and start_utc matching the documented patterns when scheduled and empty strings when declined, and attendees a sorted list of unique strings. It reads the result with O_NOFOLLOW so a symlinked output path cannot alias another file. Grading is all-or-nothing across all forty requests. Every rule in the policy was confirmed to do real work by mutation testing: altering any one of the eleven -- moving the lunch exemption from priority 1 to priority 2, comparing the daily cap with >= instead of >, replacing the candidate weighing with plain first-fit, dropping travel buffers, dropping home-site travel, ignoring working hours, ignoring the cap, ignoring lunch, ignoring PTO, or replacing the ordering with priority-only or catalogue order -- changes the resulting schedule, so no rule is decorative and a solver cannot pass while getting one wrong. Measured against the real verifier: oracle 1.0 in 0.05 s and stable across re-runs, nop 0, and 0 for each of the eleven wrong-policy implementations above plus a one-request-wrong near-miss, reversed attendee lists, a reversed array, a dropped entry, +00:00 instead of Z, declining everything, and a symlinked output path."

