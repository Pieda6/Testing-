artifacts = ["/app/result.json"]

[task]
name = "dynamo/ecdsa-nonce-lattice"
description = "Recover an ECDSA private key from signatures whose nonces share a secret high-bit prefix, via a Hidden Number Problem lattice attack."

[metadata]
# --- pre-seeded by the Dynamo team; DO NOT MODIFY ---
category = "Security"
subcategory = "Cryptanalysis"
# --- fellow-set ---
task_objective = ["cryptographic_key_recovery"]
artifact_type = ["structured_data_file"]
expert_time_estimate_hours = 2.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The corpus has no nonce reuse, so the trivial break fails. Every documented biased-nonce lattice attack assumes the leaked bits are zero (short nonces); here the shared high bits are a nonzero UNKNOWN constant, so the textbook lattice has no short target vector and returns a wrong key that fails the d*G==Q self-check. The decisive, non-templated step is differencing signature equations to cancel the unknown shared prefix, turning the corpus into a standard HNP instance, then building a correctly scaled Boneh-Venkatesan lattice with enough samples. Stating this rule in the instruction does not trivialize it: deriving the differencing reduction and the lattice scaling is the real cryptanalytic work. The corpus is synthetic, generated deterministically from a fixed seed."
solution_explanation = "For each signature k_i = a_i + t_i*d (mod n) with a_i=s_i^-1*h_i, t_i=s_i^-1*r_i. Because every nonce shares the same top 8 bits, differencing against one pivot signature cancels the shared high part and leaves (k_i-k_0) = (a_i-a_0)+(t_i-t_0)d (mod n) with |k_i-k_0| < 2^247. Build a Boneh-Venkatesan lattice from the differenced (a,t) pairs, scale residue rows by n//2^247 so the target vector is balanced, run LLL, and read d off the short vector; confirm via d*G==Q. Runs in under one second with fpylll."
verification_explanation = "The verifier embeds only the signer's public key Q (public, immutable) and independently recomputes d*G on secp256k1, asserting it equals Q. Finding d with d*G==Q is the discrete-log problem itself, so a false accept is impossible and no private key is stored in the image. It also pins the output schema (JSON object, 'private_key' must be a hex string decoding to 1<=d<n; JSON numbers/NaN/Infinity rejected) and reads the result with O_NOFOLLOW to block symlink aliasing."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

