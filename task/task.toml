artifacts = ["/app/tags.json"]

[task]
name = "dynamo/legacy-tag-forge"
description = "Recover an undocumented in-house 32-bit authentication tag routine from a partly corrupt provisioning archive and forge tags for held-out records."

[metadata]
# --- pre-seeded by the Dynamo team; DO NOT MODIFY ---
category = "security"
subcategory = "cryptanalysis"
# --- fellow-set ---
task_objective = ["analyze"]
artifact_type = ["security_artifact"]
expert_time_estimate_hours = 2.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "There is no named attack to reach for. The tag routine is a one-off in-house construction, so CRC, HMAC and hash guesses are dead ends -- measured on the shipped data, CRC-32 and truncated SHA-256 of the packed record both score 0/60. The routine is in fact affine over GF(2): each of the 32 tag bits is the XOR of a fixed secret subset of the record's 128 input bits, optionally complemented. That has to be noticed from the archive (parity relations hold across triples of records, which no arithmetic or rotation-based checksum would satisfy) and then rebuilt as 32 independent 129-unknown linear systems. Two properties make near-misses fail silently rather than loudly. First, fewer than ten of the 400 archived rows carry a corrupt tag and their indices are not recorded: a plain elimination over all rows reaches full rank and raises nothing, but absorbs corrupt rows into the pivot basis and poisons the affected output bits. Measured on the shipped data, that naive solve yields 1 of 60 correct tags. The fix is to solve, measure the residual against every row, and restart from another offset when it is large. Second, grading is on 60 held-out challenge records for which the agent has no tags, so agreeing with the archive is not evidence of correctness and there is no free self-check to iterate against -- a nearest-neighbour lookup over the samples scores 0/60. Grading is all-or-nothing across all 60 tags. The corpus is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Pack each record as a 128-bit integer with serial in the low 32 bits, then batch, model and nonce, and append a constant term so the unknown vector is 129 bits wide. Test the archive for affinity over GF(2) -- for random triples, tag(x1) xor tag(x2) xor tag(x3) equals tag(x1 xor x2 xor x3) xor c -- which identifies the construction. Then for each of the 32 output bits solve the 129-unknown system over GF(2) by Gaussian elimination. Because a few archived tags are corrupt, do not trust a single pass: after solving, evaluate the recovered form against all 400 rows and count disagreements; if the residual is large a corrupt row entered the basis, so restart the elimination from a different row offset and keep the solution with the smallest residual (which lands at exactly the number of corrupt rows affecting that bit). Finally evaluate the 32 recovered affine forms on each challenge record and write the tags. Runs in about 0.6 s in pure Python."
verification_explanation = "The 60 correct tags live in tests/expected_tags.json, which is overlaid only at verification time and is never copied into the agent image, so the answers are unreachable from inside the task. No challenge record shares an input vector with any sample, so the tags cannot be looked up -- only a recovered rule generalises. The verifier compares all 60 tags exactly; there is no tolerance to calibrate because the target is a bit-exact 32-bit value. It also pins the output schema (JSON object, 'tags' an array of exactly 60 hex STRINGS each below 2^32, so JSON numbers, NaN and Infinity are rejected) and reads the result with O_NOFOLLOW to block symlink aliasing. Grading is all-or-nothing: a 59-of-60 submission scores 0, verified."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
