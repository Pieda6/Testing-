artifacts = ["/app/result.json"]

[task]
name = "dynamo/ecdsa-nonce-lattice"
description = "Recover an ECDSA private key from signatures whose per-session nonce windows sit at unknown positions and differ in width, via a Hidden Number Problem lattice attack."

[metadata]
# --- pre-seeded by the Dynamo team; DO NOT MODIFY ---
category = "security"
subcategory = "cryptanalysis"
# --- fellow-set ---
task_objective = ["analyze"]
artifact_type = ["security_artifact"]
expert_time_estimate_hours = 3.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The corpus has no nonce reuse, so the trivial break fails, and FOUR independent mechanisms must all be handled correctly before the lattice finds anything -- each failing silently with a wrong key rather than erroring. (1) Nonces are k = A_g + e with 0 <= e < 2^(W_g), and A_g carries full ~256-bit entropy, so it cannot be guessed or enumerated and must be cancelled algebraically by differencing; a stuck B-bit prefix would instead let an agent skip the reduction and try all 2^B candidates, and the textbook zero-MSB lattice returns a wrong key that fails the d*G==Q self-check. (2) The base is PER SESSION, so differencing is only valid within a session -- the templated single-global-pivot recipe mixes unrelated bases and produces rows that are not small. (3) Some records are stored with BIP-62 low-s normalization (s = n - s_true), so those equations describe -k rather than +k; a real-world footgun that silently corrupts a third of the system. (4) Each session has its OWN window width, so every differenced row carries its own bound and must be scaled individually. The widths (252, 250, 244, 240) are chosen so that NO uniform K can work: assuming the widest starves the lattice (4*40 = 160 bits against the 256 needed) while any narrower assumption is violated by the true offsets of the wider sessions. Measured on the shipped data, uniform K at 252, 250, 248, 244 and 240 all fail, as do session-blind differencing, ignoring the normalization, and unscaled rows -- while the correct per-row construction succeeds from any pivot choice. Every mechanism is announced by an explicit field, so all of it is derivable from what the agent sees; the difficulty is that the standard recipe ignores all four and the agent gets no error, just a wrong key. Grading is all-or-nothing on a single recovered key, so three of four correct scores zero. Correct per-row bounds give 4*10 + 6*10 + 12*10 + 16*10 = 380 bits of information against 256 needed (margin ~1.48). The corpus is synthetic, generated deterministically from a fixed seed."
solution_explanation = "For each record undo the low-s normalization where flagged (s_true = n - s), then form a_j = s_true^-1*h_j and t_j = s_true^-1*r_j so that k_j = a_j + t_j*d (mod n). Group records by session and difference each session against its own pivot: this cancels that session unknown base A_g and leaves (k_j - k_p) = (a_j - a_p) + (t_j - t_p)d (mod n) with |k_j - k_p| < 2^(W_g), where W_g is that session own window width from session_window_bits. Stack all 40 differenced equations into one Boneh-Venkatesan lattice, scaling each residue column by its OWN factor F_i = n // K_i so that every coordinate of the target vector is ~n regardless of which session the row came from, run LLL, and read d off the short vector; confirm via d*G==Q. Runs in about 0.15 s with fpylll."
verification_explanation = "The verifier embeds only the signer's public key Q (public, immutable) and independently recomputes d*G on secp256k1, asserting it equals Q. Finding d with d*G==Q is the discrete-log problem itself, so a false accept is impossible and no private key is stored in the image. It also pins the output schema (JSON object, 'private_key' must be a hex string decoding to 1<=d<n; JSON numbers/NaN/Infinity rejected) and reads the result with O_NOFOLLOW to block symlink aliasing."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

