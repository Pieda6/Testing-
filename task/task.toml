artifacts = ["/app/tags.json"]

[task]
name = "dynamo/legacy-tag-forge"
description = "Recover an undocumented in-house 32-bit authentication tag routine from a partly corrupt provisioning archive and forge tags for held-out records."

[metadata]
# --- pre-seeded by the Dynamo team; DO NOT MODIFY ---
category = "security"
subcategory = "cryptanalysis"
# --- fellow-set ---
task_objective = ["analyze"]
artifact_type = ["security_artifact"]
expert_time_estimate_hours = 3.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "There is no named attack to reach for. The tag routine is a one-off in-house construction, so CRC, HMAC and hash guesses are dead ends -- measured on the shipped data, CRC-32 and truncated SHA-256 of the packed record both score 0/60. The routine is affine over GF(2): each of the 32 tag bits is the XOR of a fixed secret subset of the record 128 input bits, optionally complemented. That has to be noticed from the archive (parity relations hold across triples of records, which no arithmetic or rotation-based checksum would satisfy) and then rebuilt. Two properties make near-misses fail silently rather than loudly. First, 12 of the 240 archived rows have their tag REPLACED OUTRIGHT, not merely bit-flipped, and their indices are not recorded. Because the corruption is row-wise, every output bit sees the same ~5 percent of bad rows, so no fixed choice of pivot rows dodges them and no amount of re-ordering helps: on the shipped data the best contiguous 129-row window leaves a residual of 111 where a clean basis leaves exactly 12. A plain elimination still reaches full rank and raises nothing. Measured on the shipped data, a naive first-129 basis, the best fixed-offset basis, and an all-rows elimination each score 0 of 60. The way through is to search for a clean basis at random and score candidates by FULL-tag agreement, where a corrupt row disagrees with certainty; that converges in a few thousand draws. Second, grading is on 60 held-out challenge records for which the agent has no tags, so agreeing with the archive is not evidence of correctness and there is no free self-check to iterate against -- a nearest-neighbour lookup over the samples scores 0/60. Grading is all-or-nothing across all 60 tags; a 59-of-60 submission scores 0, verified. The corpus is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Pack each record as a 128-bit integer with serial in the low 32 bits, then batch, model and nonce, and append a constant term so the unknown vector is 129 bits wide. Test the archive for affinity over GF(2) -- for random triples, tag(x1) xor tag(x2) xor tag(x3) equals tag(x1 xor x2 xor x3) xor c -- which identifies the construction. Then find a clean basis: sample 129 rows at random and solve ALL 32 output bits from that single elimination by carrying the 32-bit tag along as the right-hand side, then score the candidate by full-tag agreement over all 240 rows. A corrupt row has an unrelated tag, so it disagrees with certainty; a clean basis therefore scores a residual equal to the number of corrupt rows while a poisoned basis scores near half the archive. Stop once the residual falls inside the disclosed bound of twenty. With 12 bad rows in 240 a random basis is clean with probability about 0.95^129, so this converges in a few thousand draws. Finally evaluate the recovered map on each challenge record. The reference runs in about 85 s in pure Python with a seeded RNG, so it is deterministic."
verification_explanation = "The 60 correct tags live in tests/expected_tags.json, which is overlaid only at verification time and is never copied into the agent image, so the answers are unreachable from inside the task. No challenge record shares an input vector with any sample, so the tags cannot be looked up -- only a recovered rule generalises. The verifier compares all 60 tags exactly; there is no tolerance to calibrate because the target is a bit-exact 32-bit value. It also pins the output schema (JSON object, 'tags' an array of exactly 60 hex STRINGS each below 2^32, so JSON numbers, NaN and Infinity are rejected) and reads the result with O_NOFOLLOW to block symlink aliasing. Grading is all-or-nothing: a 59-of-60 submission scores 0, verified."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
