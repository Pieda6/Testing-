artifacts = ["/app/result.json"]

[task]
name = "dynamo/ecdsa-nonce-lattice"
description = "Recover an ECDSA private key from signatures whose nonces are confined to a narrow window at an unknown position, via a Hidden Number Problem lattice attack."

[metadata]
# --- pre-seeded by the Dynamo team; DO NOT MODIFY ---
category = "security"
subcategory = "cryptanalysis"
# --- fellow-set ---
task_objective = ["analyze"]
artifact_type = ["security_artifact"]
expert_time_estimate_hours = 2.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The corpus has no nonce reuse, so the trivial break fails. Every documented biased-nonce lattice attack assumes the leaked bits are zero (short nonces); here the nonces sit in a window whose base A is unknown, so the textbook lattice has no short target vector and returns a wrong key that fails the d*G==Q self-check. The decisive, non-templated step is differencing the signature equations against a pivot to cancel A, turning the corpus into a standard HNP instance, then building a correctly scaled Boneh-Venkatesan lattice. Two shortcuts are closed by construction. A carries full ~256-bit entropy, so it cannot be guessed or enumerated -- unlike a stuck B-bit prefix, where an agent can sidestep the reduction by trying all 2^B candidates. And the window is only 8 bits narrower than n, so each differenced pair yields ~8 bits: the lattice needs more than 32 equations and 40 signatures are supplied (margin ~1.22). Measured on the shipped data, the same construction fails at 36 signatures even under BKZ-20, and an unscaled lattice fails at every count tested, while every valid variant tried (any pivot, rounded scale factors, a 2x-off constant column, BKZ) succeeds -- so the margin punishes wrong methods, not merely different ones. Stating the RNG fault in the instruction does not trivialize it: deriving the differencing reduction and the lattice scaling is the real cryptanalytic work. The corpus is synthetic, generated deterministically from a fixed seed."
solution_explanation = "For each signature k_i = a_i + t_i*d (mod n) with a_i=s_i^-1*h_i, t_i=s_i^-1*r_i. Because every nonce is A + e_i for one unknown base A with 0 <= e_i < 2^248, differencing against one pivot signature cancels A and leaves (k_i-k_0) = (a_i-a_0)+(t_i-t_0)d (mod n) with |k_i-k_0| < 2^248. Build a Boneh-Venkatesan lattice from the differenced (a,t) pairs, scale residue rows by n//2^248 so the target vector is balanced, run LLL, and read d off the short vector; confirm via d*G==Q. Runs in about 0.2 s with fpylll."
verification_explanation = "The verifier embeds only the signer's public key Q (public, immutable) and independently recomputes d*G on secp256k1, asserting it equals Q. Finding d with d*G==Q is the discrete-log problem itself, so a false accept is impossible and no private key is stored in the image. It also pins the output schema (JSON object, 'private_key' must be a hex string decoding to 1<=d<n; JSON numbers/NaN/Infinity rejected) and reads the result with O_NOFOLLOW to block symlink aliasing."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

