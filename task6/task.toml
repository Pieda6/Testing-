[task]
name = "dynamo/schedule-recovery"
description = "Recover the offset-change rule of a scheduler host and twenty-four cron schedules from three years of firing history, then predict every instant each job fires over the following ten months."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Systems Infrastructure and Operations"
subcategory = "Scheduling and automation infrastructure"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
