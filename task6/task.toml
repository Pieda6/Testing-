# --- You fill these in ---
task_objective = ["analyze"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 6.0
difficulty_explanation = "Reconstructing what a scheduler is going to do from what it has already done is routine work for the people who run scheduling infrastructure: an SRE inheriting a host whose crontab was edited out of band and has to be rebuilt from the logs, a platform team planning a migration window and needing to know exactly which jobs will fire during it, a capacity planner projecting load from history. Three years of firing history for twenty-four jobs is given, 21308 instants, together with the host's UTC offset at the start of the log and the eight intervals during which the host was down. Everything else has to be inferred. The awkward parts are the ones that make that job hard in practice. First, cron ORs day-of-month against day-of-week when both are restricted -- `0 0 13 * FRI` fires on the 13th and on every Friday, not on Friday the 13th -- and this is the most misread rule in the format; six of the twenty-four jobs are shaped this way, and reading it as AND gets 17 of 24 jobs right. Second, the host was down for eight intervals during which nothing ran and nothing was logged, so silence is not evidence; treating an outage gap as a schedule gap produces a day-of-month set that is wrong in exactly the way that reproduces the log. Third, and this is where the difficulty actually lives, the host's offset moves and its transitions are NOT given. They are visible in the log -- at one instant every daily job's UTC firing times shift together -- so recovering them is inference, and pinning one to a single instant takes a specific observation: a job whose local times are the even hours, because shifting those by an hour lands them on the odd hours, a disjoint set with something to check in every hour of the day. A contiguous run of times is no use, since sliding it by an hour covers itself everywhere except at its two ends. Direction needs a second job, because the even hours look identical shifted either way. Six changes fall inside the log and two fall inside the window to be predicted, and the two in the prediction window are never observed: they have to be produced by fitting a rule -- month, weekday, which occurrence of that weekday, which local hour -- to the six that were. That last step is the crux, because no amount of checking against the log can validate it. Every figure that follows is the number of the twenty-four jobs a submission still gets fully right, measured on the shipped data with the real verifier, and for each of these the recovered schedules reproduce all 21308 logged firings exactly -- so a solver that validates its work against the history is told everything is fine. Reading the rule as the 4th of that weekday where the truth is the last: 6, or 6 and 7 if only one of the two changes is misread. The two readings agree in a month with four of that weekday and disagree in a month with five, and both months in the prediction window have five, so this is settled by the data and silently lost by anyone who does not look. Placing the change an hour late: 20. A week late: 1. Applying neither future change, that is freezing the clock where the log ends: 0. Applying the first but not the second: 3. Getting the direction of the change backwards: 0. Emitting one instant where a backward change repeats a local time: 22. The errors that do announce themselves are the honest, self-correcting ones -- reading logged timestamps as local, or holding the base offset with no transitions at all, or treating outage silence as evidence, each leaves no schedule consistent with the log at all. Grading is all-or-nothing across all twenty-four jobs, so every figure above scores zero. Difficulty survives full disclosure: the instruction states the OR rule, the outage semantics, and the exact form of the offset rule including that the occurrence may be the last one. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Two stages. First the clock. The jobs that fire every day read it directly: their local firing times are a fixed set, so their UTC times are that set displaced by the offset in force, and a change shows up as all of them moving together on one day. Finding the day is a matter of fitting a displacement per day and looking for where it moves. Pinning the instant is the part that needs thought: lean on the job whose local times are the even hours, since shifting those by an hour lands on the odd hours, a disjoint set, so there is a distinguishing instant in every hour of the day -- a contiguous run would cover itself everywhere but its two ends and let the change hide inside. Direction comes from any second daily job on a different minute, whose UTC times move the opposite way. Test each candidate by rebuilding the local times around the change and asking whether it reproduces exactly what those jobs did, including the firings a forward change deletes and the doubled ones a backward change creates; only whole local hours need be considered, as the rule form says. With the six logged changes in hand, fit month, weekday, occurrence and local hour to each of the two rules, and run them forward through the prediction window. Exactly one rule pair fits. Then the schedules. Build the map from a local (date, hour, minute) to the UTC instants that reach it, over the log and over the prediction window, skipping minutes inside an outage; the transitions are then built into the map's shape, so a local time deleted by a forward change has no instants and one repeated by a backward change has two, and nothing downstream needs to know about them. The minute and hour fields read straight off the log. Classify each local date: FIRED if every slot it could have used is in the log, SILENT if none is, UNKNOWN if it has no usable slot at all -- deleted, clipped by the window edge, or inside an outage. That unknown class is what keeps outage silence from being read as evidence. What is left is the day fields, and the search is small once framed right: day-of-week has 127 non-empty subsets, so enumerate them, and for each, the day-of-month set follows from the dates the day-of-week term does not already cover, since the OR rule makes the dates it does cover uninformative. Check every surviving pair against the whole log, then project. The reference implementation is pure standard-library Python, uses no randomness and no network, and does the clock and all twenty-four jobs in about 23 seconds against a 3600 second budget, so the binding constraint is getting the model right rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "The answer is a set of future firing instants per job, so grading is exact and needs no tolerance: 5911 timestamps across twenty-four jobs, compared for equality, all-or-nothing. The schema is pinned strictly -- a JSON object with a schedules array of exactly one entry per job in the order the jobs appear in the input, each entry exactly the fields id and fires, id matching JOB-nnn, every instant a string of the form YYYY-MM-DDTHH:MM:SSZ, instants strictly ascending, and every instant inside the half-open prediction window. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The answer key and the window bounds live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the bounds are kept there rather than read back from /app/data because that directory is writable by the agent. The key was established twice over by two paths that share no code: once by recovering the clock and the schedules from the log alone and projecting them forward, and once by simulating the generator's hidden schedules forward directly under the true clock, with zero disagreement on all 5911 instants. The recovered clock was separately checked against the generator's, including the two transitions inside the prediction window that the log never shows. Well-posedness was proved rather than assumed: the generator's validator enumerates every offset rule consistent with the six logged changes and every schedule consistent with the log, and finds exactly one of each, so the answer is well defined. The calendar was chosen for this -- three of that weekday-occurrence fall inside the log and two are in months with five of that weekday, which is what separates the last occurrence from the fourth; two observations would leave the two readings tied. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; empty array 0; every job predicted silent 0; the correct answer placed behind a symlink 0. Zero for one instant dropped, one instant added, one instant one minute late, one an hour early, one a day late, the job order reversed, instants listed descending, ids renumbered, an extra field per entry, and instants written without the trailing Z. Zero as well for each wrong approach measured end to end, and for the clock errors it was confirmed by re-simulation that the wrong clock still reproduces every one of the 21308 logged firings, so the failure is silent rather than announced: the fourth occurrence read for the last one, that misreading applied to one change or the other, the change placed an hour late or a week late, the clock frozen where the log ends, only the first of the two future changes applied, the direction of the change reversed, a repeated local time emitted once, and day-of-month AND day-of-week."

