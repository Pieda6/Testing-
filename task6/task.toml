artifacts = ["/app/answer.json"]

[task]
name = "dynamo/schedule-recovery"
description = "Recover thirty cron-style schedules from twenty-five months of firing history on a host whose UTC offset shifts, then predict every instant each job fires over the next two months."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Systems Infrastructure and Operations"
subcategory = "Scheduling and automation infrastructure"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["analyze"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 4.0
difficulty_explanation = "Reconstructing what a scheduler is going to do from what it has already done is routine work for the people who run scheduling infrastructure: an SRE inheriting a host whose crontab was edited out of band and has to be rebuilt from the logs, a platform team planning a migration window and needing to know exactly which of thirty jobs will fire during it, a capacity planner projecting load from history. The awkward parts here are the ones that make that job hard in practice rather than invented difficulty. First, cron ORs day-of-month against day-of-week when both are restricted -- `0 0 13 * FRI` fires on the 13th and on every Friday, not on Friday the 13th -- and this is the single most misread rule in the format; six of the thirty jobs are shaped this way, and reading it as AND gets 13 of 30 jobs right. Second, the host's clock is not UTC and its offset moves: four transitions inside the log and two more inside the window to be predicted. Matching happens in local time, so a transition that moves the clock forward deletes local times and a job scheduled inside the deleted stretch does not fire that day, while one that moves it backward repeats them and the job fires twice at two different UTC instants. The offsets are given explicitly and deliberately match no real zone, so a library primed with tzdata is wrong and the work cannot be delegated to one. Third, the host was down for nine intervals during which nothing ran and nothing was logged, so silence is not evidence; treating an outage gap as a schedule gap produces a day-of-month set that is wrong in exactly the way that reproduces the log. What makes those three compose into real difficulty is that they fail in different places. An error in the clock model or in the outage handling contradicts the log itself, so a solver that checks its recovered schedules against the history finds out and can recover -- that is the honest, self-correcting part. An error in the projection is silent: the recovered schedule is right, it reproduces all 20322 logged firings perfectly, and only the future timestamps are wrong. Every figure that follows is the number of the thirty jobs a submission still gets fully right, measured on the shipped data with the real verifier. Freezing the clock at the end of the log -- that is, recovering the schedules correctly and then ignoring the two transitions ahead: 5. Applying the first of those two but not the second: 2. Applying the day-of-month and day-of-week fields with AND: 13. Emitting one instant where a backward transition repeats a local time: 26. Ignoring the offsets and reading logged timestamps as local: 0. Walking local minutes and converting back with a single offset, which invents an instant for a local time that was deleted: 5. Grading is all-or-nothing across all thirty, so each of those scores zero. Difficulty survives full disclosure: the instruction states the OR rule, the clock model and the outage semantics outright, and the task is still an inference problem -- twenty-five months and 20322 firings have to be turned into a day-of-month set and a day-of-week set per job, under partial observation, with the transitions and outages knocked out of the evidence, and then run forward through a clock that changes twice more. There is no library call that does it. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Work in local time throughout and the awkward cases stop needing special handling. Walk the log window one minute at a time, apply the offset in force to get the local time, and build the map from a local (date, hour, minute) to the UTC instants that reach it, skipping minutes inside an outage. That map has the transitions built into its shape: a local time deleted by a forward jump has no instants, one repeated by a backward jump has two, and an outage leaves a hole. Build the same map over the prediction window, where the same two facts then apply for free. The minute and hour fields read straight off the log, since a job that matches a date fires at every hour-minute combination on it, so the observed minutes and the observed hours are exactly the two sets. Then classify each local date: it FIRED if every slot it could have used is in the log, was SILENT if none is, and is UNKNOWN if it has no usable slot at all -- every one deleted, clipped by the window edge, or inside an outage. The unknown class is what keeps outage silence from being read as evidence. What is left is the day fields, and the search is small once framed right: day-of-week has 127 non-empty subsets, so enumerate them, and for each one the day-of-month set follows from the dates the day-of-week term does not already cover -- a firing date forces its day number in, a silent one forces it out, and the OR rule means dates the day-of-week term already fires are simply uninformative about day-of-month. Day numbers forced neither way are free and are enumerated too, which over this data is a handful. Every surviving pair is then checked against the whole log before being used. Thirty-nine pairs survive across the thirty jobs -- nine jobs admit two -- and all pairs for a given job project to the same future instants, which is why the answer is timestamps and not a rewritten crontab. Project by scanning the prediction window's map and emitting every instant whose local time matches. The reference implementation is pure standard-library Python, uses no randomness and no network, and does all thirty jobs in about 8 seconds against a 3600 second budget, so the binding constraint is getting the model right rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "The answer is a set of future firing instants per job, so grading is exact and needs no tolerance: 1581 timestamps across thirty jobs, compared for equality, all-or-nothing. The schema is pinned strictly -- a JSON object with a schedules array of exactly one entry per job in the order the jobs appear in the input, each entry exactly the fields id and fires, id matching JOB-nnn, every instant a string of the form YYYY-MM-DDTHH:MM:SSZ, instants strictly ascending, and every instant inside the half-open prediction window. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The answer key and the window bounds live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the bounds are kept there rather than read back from /app/data because that directory is writable by the agent. The key was established twice over by two paths that share no code: once by running the reference inference over the log and projecting the recovered schedules forward, and once by simulating the generator's hidden schedules forward directly from the same clock and outage definitions, with zero disagreement on all 1581 instants. Separately, the generator's validator enumerates every schedule consistent with the log and confirms they all project identically -- 39 schedules across the thirty jobs, nine jobs admitting two -- so the answer is well defined even where the schedule itself is not unique, and the grading does not privilege one of several equally correct readings. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; empty array 0; every job predicted silent 0; the correct answer placed behind a symlink 0. Zero for one instant dropped, one instant added, one instant one minute late, one an hour early, one a day late, the job order reversed, instants listed descending, ids renumbered, an extra field per entry, and instants written without the trailing Z. Zero as well for each of the wrong approaches measured end to end: clock frozen at the end of the log, only the first of the two future transitions applied, day-of-month AND day-of-week, a repeated local time emitted once, offsets ignored entirely, and local minutes converted back with a single offset."

