artifacts = ["/app/answer.json"]

[task]
name = "dynamo/hai-surveillance-adjudication"
description = "Recover twelve redacted constants of a surveillance definitions manual from a prior state audit, then use them to adjudicate which healthcare-associated infections are reportable across a held-out quarter of synthetic inpatient records."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"
subcategory = "Medical and Clinical Workflows"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["analyze", "generate"]
artifact_type = ["generated_output_artifact", "document_or_report"]
expert_time_estimate_hours = 6.0
difficulty_explanation = "This is the work of a hospital infection preventionist calibrating against a state validation audit -- adversarially reviewed, financially consequential, and with a documented human error rate, which is why validation programmes exist at all. The shipped manual defines the surveillance rules but its constants are redacted: twelve values are missing, marked in the text, covering how far the infection window reaches back and forward, how far apart two commensal cultures may be drawn, whether an event is dated by its earliest element or by its anchor, which admission day separates present-on-admission from healthcare-associated, which infection type is adjudicated first, how long the repeat infection timeframe runs, where the secondary attribution period opens and how long it runs, how many days a central line must have been in place, how long after removal still counts, and how close a ward transfer sends an event to the transferring ward. They are recoverable only from audited.json, a prior audit of 28 patients whose 24 adjudications were validated under the complete manual. The held-out quarter is 36 further patients with no adjudications. The instruction states outright that several constants are not the values any familiar surveillance system uses, so they have to be recovered rather than assumed. Three things make this hard. First the fit is joint, not separable: the width of the window decides the date of event, and the date of event decides healthcare association, ward attribution and line association together, so constants recovered one at a time are each defensible and wrong in combination. Second the audit has to be read for what it excludes -- the validated entries reporting NO event for a patient with a positive culture are what pin the admission-day cut and the window edges, and a solver that only looks at the entries reporting events pins almost nothing. Third, and this is where the task is decided, nothing checks the fit on the held-out quarter: a setting that reproduces the entire audit and is still wrong produces a complete, coherent, plausible adjudication that no part of the data contradicts. Every figure that follows is the number of the 36 held-out patients still fully right when exactly one constant is recovered wrongly, measured with the real verifier. Dating events by the anchor rather than the earliest element: 27. Adjudicating bloodstream infections first: 32. The window one day narrow at the back: 32. One day wide at the back: 34. The admission-day cut moved either way: 34 and 34. The attribution period opening at the date of event rather than the window start: 34. Not counting the day after line removal: 34. The window off by a day at the front, in either direction: 35 and 35. The commensal gap off either way: 35 and 35. The timeframe a day short or a day long: 35 and 35. The attribution period three days short or one day long: 35 and 35. The line-day threshold off either way: 35 and 35. The transfer window off either way: 35 and 35. And a solver that recognises the domain and fills in the values it remembers instead of recovering them -- the familiar attribution period, opening where that system opens it -- gets 35. Grading is all-or-nothing across all 36 patients and all five ward denominators, so every figure above scores zero. The data is synthetic, generated deterministically from a fixed seed; there are no real records and no real identifiers, and the work is administrative classification against a written rule set rather than diagnosis or treatment."
solution_explanation = "Build the adjudication procedure from the manual with all twelve constants left free, recover them from the audit, then apply them to the held-out quarter. The recovery is a search, and framing it well is most of the work. The constants fall into three groups by what they can affect, which turns an otherwise enormous product into something that finishes in seconds: five of them -- the two window widths, the commensal gap, the dating rule and the admission-day cut -- decide which candidates exist at all, so candidate pools need building only once per setting of those five; four more -- the adjudication order, the timeframe length, and where the attribution period opens and how long it runs -- decide which candidates are reported and with which organisms; and the last three -- the line-day threshold, the days after removal, and the transfer window -- decide only the ward and the line flag of an event that is already settled, so they can be tried last, and only for settings whose reported events already match. Comparing dates and organisms before wards and flags is what makes the middle stage cheap. The reference implementation searches a grid deliberately wider than the truth in every direction, exhaustively, with early rejection, and confirms exactly one setting survives before using it. It is pure standard-library Python, uses no randomness and no network, and recovers the constants in about 3.4 seconds against a 3600 second budget, so the binding constraint is framing the fit rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout. With the constants in hand the adjudication itself is the procedure the manual describes: build candidates, date them by the recovered rule, drop those failing the admission-day cut, adjudicate the first type completely and then the second, each in date-of-event order, holding one open timeframe per type that suppresses same-type repeats and absorbs their organisms, demoting a bloodstream candidate to secondary when a reported urinary event covers its anchor and shares an organism, and finally attributing each event to a ward and deciding line association."
verification_explanation = "An adjudication is a set of discrete determinations, so grading is exact and needs no tolerance: every value is a date, a ward name, an organism name from a fixed vocabulary, or an integer. The schema is pinned strictly -- one entry per held-out patient in record order, one per ward in the order the records list them, exact field sets, dates as YYYY-MM-DD, wards drawn from the records, organism lists non-empty, sorted and duplicate-free, events ordered by date of event, central line association a real JSON boolean rather than 0/1, day counts non-negative integers. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The answer key, the patient order and the ward order live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the orders are kept there rather than read back from /app/data because that directory is writable by the agent. The audit shipped to the agent covers a disjoint set of patients and carries no information about the held-out answers beyond the constants themselves. Well-posedness was proved rather than assumed, and this is the load-bearing check: a grid of 4811400 settings, wider than the truth in every direction, was exhausted against the audit, and exactly one setting reproduces all 24 validated adjudications -- the setting the data was generated from. The first sweep found two survivors differing in where the attribution period opens, because that discriminator had been built with its sign exactly at the window edge, which makes the two readings coincide; a patient was added whose sign sits one day inside, with a blood culture in the resulting gap, and the re-run leaves one. The held-out quarter was then checked to exercise every constant: each of the 21 single-constant perturbations changes the answer for at least one held-out patient, so no recovered value is decorative. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; nothing reported for anyone 0; all denominators zero 0; the correct answer behind a symlink 0. Zero for one bloodstream event dropped, one urinary event dropped, one event dated a day late, one line association flipped, one event charged to the wrong ward, one organism dropped from a merged list, one ward count off by one, patients reversed, wards reversed, organisms unsorted, line association as 0/1, and an extra field per patient. Zero as well for every single-constant misrecovery, which range from 27 to 35 of 36 patients correct, and for a solver that fills the constants in from memory instead of recovering them."

