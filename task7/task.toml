[task]
name = "dynamo/hai-surveillance-adjudication"
description = "Recover twelve redacted constants of a surveillance definitions manual from a quarterly summary table published under it, then use them to adjudicate which healthcare-associated infections are reportable across a held-out quarter of synthetic inpatient records."

