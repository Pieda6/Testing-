expert_time_estimate_hours = 6.0
difficulty_explanation = "This is the work of a hospital infection preventionist calibrating against a state validation programme -- adversarially reviewed, financially consequential, and with a documented human error rate, which is why validation programmes exist at all. The shipped manual defines the surveillance rules but its constants are redacted: twelve values are missing, marked in the text, covering how far the infection window reaches back and forward, how far apart two commensal cultures may be drawn, whether an event is dated by its earliest element or by its anchor, which admission day separates present-on-admission from healthcare-associated, which infection type is adjudicated first, how long the repeat infection timeframe runs, where the secondary attribution period opens and how long it runs, how many days a central line must have been in place, how long after removal still counts, and how close a ward transfer sends an event to the transferring ward. Ten of the twelve are not the values the well-known national definitions use -- the window is asymmetric rather than three days either side, two commensal cultures may be drawn two days apart rather than one, the admission-day cut falls a day later, the repeat timeframe is shorter, the attribution period opens at the date of event rather than at the start of the window and runs longer, a line must have been in place a day longer, two days after removal still count, and the transfer rule reaches two days -- and the instruction says so outright, so recalling the familiar definitions is not a shortcut. Measured against the real verifier, a solver that fills all twelve in from memory gets 28 of the 49 held-out patients right and reproduces only 11 of the forty-five published numbers against the recovered setting's 42. What the values have to be recovered from is the crux. The prior quarter in audited.json ships its 59 admissions in full, but not its adjudications: what was published for it is what a surveillance programme actually publishes, a summary table giving for each ward and each month how many urinary events were reported, how many bloodstream events, and how many of those were central-line-associated. Fifty-nine admissions collapse into fifteen cells, forty-five numbers, and nothing else -- no patient, no date, no organism, no worked determination. That changes the character of the problem. A table of counts still pins the constants, and exactly one setting in a grid of 148500000 matches it best, but a mismatch no longer points anywhere: a cell one too high says that something in that ward that month was adjudicated differently, and says nothing about whether the cause was a wrong constant or a rule of the manual read wrongly. There is no patient to open and no determination to compare. Fitting therefore cannot be turned into debugging, which is what an audit of worked adjudications quietly allows -- score the procedure, see which patients disagree, open one, find the misread rule, repeat -- and it is why the search here has to be got right rather than iterated into place. Three of the published numbers are wrong, which ones is not recorded, so no setting reproduces the table and a search demanding one finds nothing; and a search that relaxes a constant until the last stubborn number fits lands on a setting explaining somebody's miscount and is then wrong about every held-out patient that constant touches. The recovery has to be robust and has to confirm its winner wins outright. Two rules bite that nothing in the table announces: a blood culture growing three or more organism names is disregarded in full, and organisms of the genus Candida are recognised pathogens in blood but are not eligible for a urinary event. Missing either produces a predicted table that cannot be made to match, wrong constants recovered from it, and two held-out patients wrong on top. The grid itself has to be framed rather than walked: 148500000 settings against a 3600 second budget is out of reach patient by patient, and only a solver that notices which constants can affect which decisions gets an exhaustive search into the time available. Finally, nothing checks the fit on the held-out quarter of 49 patients: a setting that matches the table and is still wrong produces a complete, coherent, plausible adjudication that no part of the data contradicts. Every figure that follows is the number of the 49 held-out patients still fully right when exactly one constant is recovered wrongly, measured with the real verifier: they run from 35 to 48, and every one of them also misses at least one published number. Grading is all-or-nothing across all 49 patients and all five ward denominators, so every one of those figures scores zero. The data is synthetic, generated deterministically from a fixed seed; there are no real records and no real identifiers, and the work is administrative classification against a written rule set rather than diagnosis or treatment."
solution_explanation = "Build the adjudication procedure from the manual with all twelve constants left free, recover them by reproducing the published summary table, then apply them to the held-out quarter. Framing the search is most of the work. The grid holding the answer has 148500000 settings, wider than the truth in every direction on every axis, and scoring each one over 59 admissions is far outside the budget. What makes it tractable is that the constants fall into three groups by what they can affect. Five of them -- the two window widths, the commensal gap, the dating rule and the admission-day cut -- decide which candidates exist at all, so candidate pools need building only once per setting of those five. Four more -- the adjudication order, the timeframe length, and where the attribution period opens and how long it runs -- decide which candidates are reported and on what date, which fixes how many events fall in each month. The last three -- the line-day threshold, the days after removal, and the transfer window -- decide only which ward an event is charged to and whether it counts as line-associated, so they cannot move an event between months. That gives the bound the search runs on: a setting whose month totals already disagree with the published ones in k places can match at most k fewer numbers however its last three constants are chosen, and is skipped whole. Inside a surviving setting the last three are not looped over the data at all. Each reported event is reduced once to the integers those two decisions turn on -- the ward it sits in, the ward before it, how many days since arrival, and for each line episode how many days since insertion and since removal -- after which trying all five transfer windows and all twenty-five line combinations is arithmetic on a small table rather than a re-walk of every admission. The reference implementation searches exhaustively, scores agreement rather than demanding consistency, and confirms one setting wins outright before using it; it is pure standard-library Python, uses no randomness and no network, and recovers the constants in about 445 seconds against a 3600 second budget, so the binding constraint is framing the fit rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout. With the constants in hand the adjudication itself is the procedure the manual describes: build candidates, disregarding blood cultures that grew three or more organism names and excluding Candida from urinary candidates, date them by the recovered rule, drop those failing the admission-day cut, adjudicate the first type completely and then the second, each in date-of-event order, holding one open timeframe per type that suppresses same-type repeats and absorbs their organisms, demoting a bloodstream candidate to secondary when a reported urinary event covers its anchor and shares an organism, and finally attributing each event to a ward and deciding line association."
verification_explanation = "An adjudication is a set of discrete determinations, so grading is exact and needs no tolerance: every value is a date, a ward name, an organism name from a fixed vocabulary, or an integer. The schema is pinned strictly -- one entry per held-out patient in record order, one per ward in the order the records list them, exact field sets, dates as YYYY-MM-DD, wards drawn from the records, organism lists non-empty, sorted and duplicate-free, events ordered by date of event, central line association a real JSON boolean rather than 0/1, day counts non-negative integers. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The verifier entrypoint is hardened so that a submission cannot grade itself. Harbor invokes tests/test.sh with the agent's own directory as the working directory, and CPython puts the working directory first on the import path, so a file the agent wrote named json.py or pytest.py is imported inside the verifier's process -- confirmed by planting one and watching the previous entrypoint execute it. The entrypoint now runs from a fresh directory of its own making rather than the agent's; invokes python with -I so that neither the working directory nor the user site directory is on sys.path and every PYTHON variable is ignored; pins the config file and the conftest cut-off to the tests directory so that a pytest.ini or a conftest.py planted above it cannot inject a plugin or be executed; disables the cache provider so pytest writes nothing outside the log directory; and deletes reward.txt and ctrf.json before writing them, each whole and then moved into place, so a symlink left in their stead is removed rather than followed. Re-measured after the change against the real container layout: the correct answer still scores 1, a wrong answer still scores 0, the planted module is no longer imported, and a reward.txt pre-planted as a symlink to /dev/null is replaced rather than written through. The answer key, the patient order and the ward order live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the orders are kept there rather than read back from /app/data because that directory is writable by the agent. The prior quarter shipped to the agent covers a disjoint set of patients and, publishing counts alone, carries no information about the held-out answers beyond the constants themselves. Four properties of the data were proved rather than assumed. Reach: every one of the 57 single-constant errors moves at least one published number, since a constant the table cannot see is not recoverable from it. Uniqueness: the grid of 148500000 settings was exhausted against the published table and exactly one setting matches the most numbers -- 42 of the 45, the setting the data was generated from -- with every other setting strictly behind. Inexplicable errors: on a table of counts this is a sharper requirement than it was on worked adjudications, because the truth matches every number but the three wrong ones, so a setting predicting a wrong number where it is published and differing nowhere else would tie or win; the corrupted positions are therefore chosen so that no single-constant error predicts the value published there, and so that no single-constant error confines all of its changes to those positions, both checked rather than assumed. Held-out reach: every one of the 57 single-constant errors changes the adjudication of at least one held-out patient, so no recovered value is decorative. Five earlier designs were rejected by these checks. Two failed uniqueness on a per-patient audit: one left two survivors differing in where the attribution period opens, because that discriminator had its sign exactly at the window edge where the two readings coincide; one let a wrong setting explain more entries than the truth, because a mis-recorded line flag and a ward charged to the receiving unit are exactly what two wrong constants predict, which is why an error a wrong setting can explain is evidence and not noise. Two failed on separability: one was built as contrastive twins, two patients identical but for one element, which pinned the constants uniquely but let each be read off one pair, and randomising every offset to destroy the twins destroyed the information with them, since charts away from a boundary pin nothing and between 168 and 792 settings tied. The fifth stacked several boundaries on every chart, which fixed separability and left the task no harder, because separability was never what made it tractable: worked adjudications are a test suite, and publishing counts instead is what removes that loop while leaving the constants recoverable. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; nothing reported for anyone 0; all denominators zero 0; the correct answer behind a symlink 0. Zero for one bloodstream event dropped, one urinary event dropped, one event dated a day late, one line association flipped, one event charged to the wrong ward, one organism dropped from a merged list, one ward count off by one, patients reversed, wards reversed, organisms unsorted, line association as 0/1, and an extra field per patient. Zero as well for every one of the 57 single-constant misrecoveries, which range from 35 to 48 of the 49 held-out patients correct and every one of which also misses at least one published number, and for a solver that fills the constants in from memory instead of recovering them, which gets 28 of 49 held-out patients and reproduces 11 of the 45 published numbers."

