expert_time_estimate_hours = 6.0
difficulty_explanation = "This is the work of a hospital infection preventionist calibrating against a state validation audit -- adversarially reviewed, financially consequential, and with a documented human error rate, which is why validation programmes exist at all. The shipped manual defines the surveillance rules but its constants are redacted: twelve values are missing, marked in the text, covering how far the infection window reaches back and forward, how far apart two commensal cultures may be drawn, whether an event is dated by its earliest element or by its anchor, which admission day separates present-on-admission from healthcare-associated, which infection type is adjudicated first, how long the repeat infection timeframe runs, where the secondary attribution period opens and how long it runs, how many days a central line must have been in place, how long after removal still counts, and how close a ward transfer sends an event to the transferring ward. Ten of the twelve are not the values the well-known national definitions use -- the window is asymmetric rather than three days either side, two commensal cultures may be drawn two days apart rather than one, the admission-day cut falls a day later, the repeat timeframe is shorter, the attribution period opens at the date of event rather than at the start of the window and runs longer, a line must have been in place a day longer, two days after removal still count, and the transfer rule reaches two days -- and the instruction says so outright, so recalling the familiar definitions is not a shortcut. Measured against the real verifier, a solver that fills all twelve in from memory gets 26 of the 47 held-out patients right and loses to the truth by 30 audit entries. The values are recoverable only from audited.json, a prior state audit of 39 patients adjudicated under the complete manual. The audit is not clean, and that is the first of three things that make this hard. It was re-adjudicated by hand, at most five of its 39 entries are wrong, and which ones is not recorded -- so no setting of the constants reproduces all of it, and a search that demands one finds nothing. Worse is the search that keeps relaxing a constant until the last stubborn entry fits: it lands on a setting that explains somebody's transcription slip and is then wrong about every held-out patient that constant touches. The recovery has to be robust -- take the setting with the highest agreement and confirm it wins outright -- which is a different and harder problem than solving a consistent system. Second, the fit is joint, and the audit is built so that it cannot be made separable. No two audit patients differ in a single element. Each one stacks several boundaries at once -- a urinary culture whose date of event is dragged backwards by a sign exactly at the edge of the window, landing exactly on the admission-day cut, with a ward transfer exactly at the edge of the transfer window measured from that date of event and a repeat culture exactly at the edge of the timeframe measured from it too -- so widening the window moves the date of event, which moves the admission-day test, the transfer test and the timeframe test with it. Measured over the shipped audit, each of the 31 boundary-bearing patients is sensitive to between three and eight of the twelve constants, 4.6 on average. A mismatch therefore says that one of several constants is wrong and does not say which; there is no comparison of two patients that reads a constant off, and no order in which the twelve can be settled one at a time. It also means a mistake in the procedure itself looks exactly like a mistake in a constant. Third, the audit has to be read for what it excludes: 24 of the 39 entries report fewer events than the patient has positive cultures -- a culture suppressed by the admission-day cut, a sign a day outside the window so nothing qualifies, a commensal pair drawn a day too far apart, a repeat absorbed into an open timeframe, a bloodstream culture demoted to secondary -- and those absences are what pin the cut, the window edges, the drawing gap, the timeframe and the attribution period. A solver reasoning only from the events that were reported pins almost nothing. The held-out quarter is 47 further patients with no adjudications, and nothing checks the fit on them: a setting that explains the audit and is still wrong produces a complete, coherent, plausible adjudication that no part of the data contradicts. That is where the task is decided. Every figure that follows is the number of the 47 held-out patients still fully right when exactly one constant is recovered wrongly, measured with the real verifier. Dating events by the anchor rather than the earliest element is the worst at 33; the window reaching one day back gives 36; the transfer rule at nought or one day gives 37 and 38; the line-day threshold two days out gives 39; the admission-day cut two days out gives 40; and the remaining fifty-two single-constant errors range from 41 to 46. Grading is all-or-nothing across all 47 patients and all five ward denominators, so every figure above scores zero. The data is synthetic, generated deterministically from a fixed seed; there are no real records and no real identifiers, and the work is administrative classification against a written rule set rather than diagnosis or treatment."
solution_explanation = "Build the adjudication procedure from the manual with all twelve constants left free, recover them from the audit, then apply them to the held-out quarter. The recovery is a search, and framing it well is most of the work: the grid that contains the answer holds 148,500,000 settings, wider than the truth in every direction on every axis, and evaluating each one against 39 audit patients is far outside the time budget. What makes it tractable is that the constants fall into three groups by what they can affect. Five of them -- the two window widths, the commensal gap, the dating rule and the admission-day cut -- decide which candidates exist at all, so candidate pools need building only once per setting of those five. Four more -- the adjudication order, the timeframe length, and where the attribution period opens and how long it runs -- decide which candidates are reported and with which organisms. The last three -- the line-day threshold, the days after removal, and the transfer window -- decide only the ward and the line flag of an event that is already settled, so they can be tried last and only for settings whose reported events already match. Comparing dates and organisms before wards and flags is what makes the middle stage cheap, and it collapses the work from the full product to 1,188,000 pool-and-walk settings. The reference implementation searches the grid exhaustively, scoring agreement rather than demanding consistency, and confirms one setting wins outright before using it. The early exit that a clean audit would allow is replaced by a bound: the three constants that only decide an event's ward and line flag cannot lift agreement above what the dates and organisms already permit, so a setting already behind the incumbent on those is skipped whole, and only 6,500 settings are ever scored in full. It is pure standard-library Python, uses no randomness and no network, and recovers the constants in about six minutes against a 3600 second budget, so the binding constraint is framing the fit rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout. With the constants in hand the adjudication itself is the procedure the manual describes: build candidates, date them by the recovered rule, drop those failing the admission-day cut, adjudicate the first type completely and then the second, each in date-of-event order, holding one open timeframe per type that suppresses same-type repeats and absorbs their organisms, demoting a bloodstream candidate to secondary when a reported urinary event covers its anchor and shares an organism, and finally attributing each event to a ward and deciding line association."
verification_explanation = "An adjudication is a set of discrete determinations, so grading is exact and needs no tolerance: every value is a date, a ward name, an organism name from a fixed vocabulary, or an integer. The schema is pinned strictly -- one entry per held-out patient in record order, one per ward in the order the records list them, exact field sets, dates as YYYY-MM-DD, wards drawn from the records, organism lists non-empty, sorted and duplicate-free, events ordered by date of event, central line association a real JSON boolean rather than 0/1, day counts non-negative integers. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The answer key, the patient order and the ward order live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the orders are kept there rather than read back from /app/data because that directory is writable by the agent. The audit shipped to the agent covers a disjoint set of patients and carries no information about the held-out answers beyond the constants themselves. Three properties of the data were proved rather than assumed, and each of them has rejected a design. Uniqueness: a grid of 148,500,000 settings, wider than the truth in every direction, was exhausted against the audit, and exactly one setting explains the most entries -- 35 of the 39, the setting the data was generated from, with every other setting strictly behind. Non-separability: for every audit patient, how many of the twelve constants have some value in the grid that changes that patient's adjudication; every boundary-bearing patient is changed by at least three and by 4.6 on average, so no patient and no pair of patients hands a constant over, and the eight patients changed by none are precisely the eight the auditor's errors are placed on. Reach: every one of the 57 single-constant errors changes the adjudication of at least one held-out patient, so no recovered value is decorative. Four earlier designs were rejected. One left two survivors differing in where the attribution period opens, because that discriminator had its sign exactly at the window edge, where the two readings coincide; a patient whose sign sits one day inside fixed it. One showed why the audit's errors have to be chosen and not sprinkled: a mis-recorded line flag and a ward charged to the receiving unit are precisely what two wrong constants predict, so a wrong setting explained more entries than the truth. Every corruption in the shipped audit is instead inexplicable under any setting -- a line association asserted for a patient who never had a line, a ward never occupied, an organism never cultured, a date no window can reach. One was built as contrastive twins, two patients identical but for one element, which pinned the constants uniquely but let each be read off one pair; and one randomised every offset to destroy the twins, which destroyed the information with them, because charts placed away from a boundary pin nothing and 168 to 792 settings tied. Stacking boundaries rather than isolating them is what gives uniqueness and non-separability at once. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; nothing reported for anyone 0; all denominators zero 0; the correct answer behind a symlink 0. Zero for one bloodstream event dropped, one urinary event dropped, one event dated a day late, one line association flipped, one event charged to the wrong ward, one organism dropped from a merged list, one ward count off by one, patients reversed, wards reversed, organisms unsorted, line association as 0/1, and an extra field per patient. Zero as well for every one of the 57 single-constant misrecoveries, which range from 33 to 46 of the 47 held-out patients correct and every one of which also loses to the truth on the audit, and for a solver that fills the constants in from memory instead of recovering them, which gets 26 of 47."

