[task]
name = "dynamo/hai-surveillance-adjudication"
description = "Adjudicate which healthcare-associated infections are reportable across one quarter of synthetic inpatient surveillance data, with the date of event, attributed ward, organisms and central line association for each, plus the ward device-day denominators."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Regulated Knowledge Work and Business Operations"
subcategory = "Medical and Clinical Workflows"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["analyze", "generate"]
artifact_type = ["generated_output_artifact", "document_or_report"]
expert_time_estimate_hours = 6.0
difficulty_explanation = "This is the daily work of a hospital infection preventionist and the surveillance analysts who support them, under a public-reporting regime. It is adversarially audited and financially consequential: healthcare-associated infection counts drive payment programs, appear on public scorecards, and are re-adjudicated by state validation audits. It is also work with a documented human error rate -- validation studies repeatedly find under-reporting and mis-classification by trained surveyors, and inter-rater reliability on bloodstream-infection adjudication is poor. That is the reason validation programs exist, and it is why the difficulty here is not invented. The data is synthetic, generated deterministically from a fixed seed; there are no real records and no real identifiers, and the task is administrative classification against a written rule set rather than diagnosis or treatment. One quarter is given: 36 patients, 37 admissions, 62 cultures, five wards, with ward transfers, central line episodes that start and stop, contaminant organisms, admissions that cross both ends of the reporting period, and one patient with two separate admissions. The definitions ship as a self-contained manual in the container, so nothing depends on which edition of a real manual the model happens to have memorised -- and the instruction says outright that the shipped excerpt governs where it differs from one. What makes it hard is that the rules are coupled, and every way of getting them wrong produces a coherent, plausible, internally consistent answer. There is no self-consistency test available: unlike a task where a recovered model can be replayed against its own source data, an adjudication cannot be checked against anything, so every error below is silent. Every figure that follows is the number of the 36 patients a submission still gets fully right, measured on the shipped data with the real verifier. Dating an event by the culture rather than by the earliest element used to meet the definition -- often a sign that precedes the culture -- gets 28 of 36 right; that single error moves the date of event, which then decides healthcare association, ward attribution and line association at once, and in one case drags an event onto admission day 2 where it stops being reportable at all. Ignoring the 14-day repeat infection timeframe and reporting every candidate: 27. Suppressing repeats but dropping their organisms instead of merging them into the original event: 28. Running the timeframe to 15 days: 34. Starting it the day after the date of event: 35. Counting a lone commensal blood culture: 32. Accepting a commensal pair without matching by name: 35. Accepting one two days apart: 35. Not applying the secondary bloodstream rule at all, so every positive blood culture becomes a primary infection: 34. Running the attribution period one day long: 35. Matching the blood organism against the urinary culture's own organisms rather than the list as it stands after earlier merges: 35 -- there is a patient whose blood culture is secondary only because of an organism a previous suppression added. Requiring admission day 4: 33. Treating day 2 as reportable: 34. Counting line days as elapsed 24-hour periods rather than calendar days: 35. Not counting the day after removal: 35. Charging the event to the receiving ward instead of the transferring one: 33. Applying the transfer rule on the day of transfer but not the day after: 35. Two further errors leave every patient right and get the ward denominators wrong, which fails just the same: not counting the removal day as a line day, and counting days outside the reporting period. Grading is all-or-nothing across all 36 patients and all five ward counts, so every figure above scores zero. Difficulty survives full disclosure -- the manual states every rule, including the order of adjudication -- because the work is executing coupled timeframe logic over dense timelines without a single slip."
solution_explanation = "Four stages. First, build candidates. A blood culture growing a recognised pathogen is a candidate on its own; a blood culture growing only commensals is not, and needs a second culture of the same admission on the same or the next calendar day growing the same commensal, plus a qualifying sign inside the window. A urine culture with a recognised pathogen needs a qualifying sign too. Commensals riding along on a pathogen culture are not organisms of the event. Second, date them, and this is where the first silent error lives: the date of event is the earliest element used to meet the definition, which is frequently a sign preceding the culture rather than the culture itself. Only then apply healthcare association, since the date of event is what the admission-day-3 cut is applied to, and a sign inside the window can pull an event that looks like day 4 back onto day 2. Third, adjudicate urinary tract infections first and then bloodstream infections, each in date-of-event order. The order is not cosmetic: a reported urinary tract infection can demote a later blood culture to secondary, and organism lists grow as suppressions merge into them, so a blood culture can be secondary only because of an organism an earlier suppression added. Keep one open repeat infection timeframe per type per patient; inside it a same-type candidate is not a new event and its organisms join the event that opened the timeframe. The timeframe counts the date of event as day 1, so day 14 is inside and day 15 is not, and it carries across admissions. Fourth, work out line association and ward attribution, both calendar-day arithmetic with an off-by-one waiting: the line must have been in place more than two calendar days and the day after removal still counts; a ward arrival on the date of event or the day before sends the event to the transferring ward. The denominators are a separate walk over calendar days, clipped to the reporting period. The reference implementation is pure standard-library Python, uses no randomness and no network, and finishes in well under a second against a 3600 second budget, so the binding constraint is reading the manual correctly rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "An adjudication is a set of discrete determinations, so grading is exact and needs no tolerance: every value is a date, a ward name, an organism name from a fixed vocabulary, or an integer. The schema is pinned strictly -- one entry per patient in record order, one per ward in the order the records list them, exact field sets, dates as YYYY-MM-DD, wards drawn from the records, organism lists non-empty, sorted and duplicate-free, events ordered by date of event, central line association a real JSON boolean rather than 0/1, and day counts non-negative integers. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. The answer key, the patient order and the ward order live in tests/, which Harbor overlays at /tests only at verification time and never in the agent image; the orders are kept there rather than read back from /app/data because that directory is writable by the agent. The key was established by two adjudicators that share no code and were written the other way round -- one over date intervals with a candidate pool, one over explicit per-calendar-day tables -- each derived from the shipped manual rather than from the other. They agree on all 36 patients and on every ward's central line day count. That agreement is the whole basis for trusting the key, because an adjudication has no self-consistency test and a single implementation's output would be nothing more than one implementation's opinion. The shipped data was checked to exercise the boundaries rather than assumed to: the admission-day-3 cut in both directions, both sides of the 14-day timeframe, a line in place exactly two days against one in place three, the day after removal against two days after, all three transfer positions, a date of event dragged before the admit date by a sign, an admission crossing each end of the reporting period, and a secondary bloodstream infection that is secondary only because of a merged organism. Measured against the real verifier: oracle 1.0 and byte-identical across re-runs; no file 0; empty object 0; nothing reported for anyone 0; all denominators zero 0; the correct answer placed behind a symlink 0. Zero for one bloodstream event dropped, one urinary event dropped, one event dated a day late, one line association flipped, one event charged to the wrong ward, one organism dropped from a merged list, one ward's day count off by one, patients returned in reverse order, wards returned in reverse order, organisms returned unsorted, line association sent as 0/1, and an extra field on every patient. Zero as well for each of the eighteen misreadings of the manual measured end to end, which range from 27 to 35 of 36 patients correct."

