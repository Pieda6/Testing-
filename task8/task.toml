artifacts = ["/app/Makefile", "/app/tools/gen-buildinfo.sh", "/app/tools/gen-manifest.sh"]

[task]
name = "dynamo/reproducible-release-bundle"
description = "Make a small C project's release bundle bit-identical for any rebuilder by removing every way its build lets the surrounding machine, clock, locale, account and filesystem into the packaged artifact."

[metadata]
# --- Pre-seeded for you when this repo was created - DO NOT EDIT ---
category = "Build Dependency and Release Management"
subcategory = "Build system configuration"
# --- Fixed for this dataset - LEAVE AS-IS ---
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
# --- You fill these in ---
task_objective = ["fix", "build_or_package"]
artifact_type = ["build_system_or_package_metadata", "archive_or_compressed_artifact"]
expert_time_estimate_hours = 3.5
difficulty_explanation = "This is the work of a release engineer or a distribution maintainer, and it is the backbone of software supply-chain integrity: reproducible builds are the only mechanism by which a published binary can be shown to correspond to the source it claims to come from. Independent rebuilders compile the same sources and compare digests, and a mismatch means the artifact cannot be trusted. It is the structural defence against a compromised build server, and it is a hard requirement in Debian, Arch, Tails, Bitcoin Core and Android, and a compliance concern under SLSA and the EU Cyber Resilience Act. Making an existing build reproducible is an unglamorous, high-value job done by hand thousands of times across the ecosystem. The project is synthetic and small -- a C library, a CLI that links it, a generated build-information header, a generated file manifest, and a Makefile that packages the result as a tar.gz -- but every defect planted in it is a real, documented entry from the catalogue the Reproducible Builds project maintains, and the layering of compile, generate, archive and package is the shape of a genuine small release. The central pitfall is the definition. Reproducible is popularly understood as the build produces the same bytes twice; the professional standard is the build produces the same bytes in a different directory, at a different time, from a fresh checkout whose file timestamps have all changed, under a different locale, timezone, umask and account, on a machine whose filesystem returns directory entries in a different order. A solver that builds twice in one container, sees identical output and stops has produced a confident, finished, wrong answer. Eleven separate leaks are planted and every one of them is load-bearing: reverting any single fix, with the other ten in place, makes the two rebuilds differ. They are the archive keeping the staged files' modification times; the archive recording the building account as owner, group, user name and group name; permission bits following the caller's umask; member order following the caller's collation; gzip embedding the input file's name and timestamp; the absolute build directory reaching the binary through the debug information; the compiler's __DATE__ and __TIME__ macros; the generated header taking its date from the clock; the same header recording who built it and on what machine; the manifest's sort following the caller's collation; and the build deriving its notion of now from the clock rather than from the tree. The traps beyond the definition are specific. Fixing only the archive layer is the common failure, because tar and gzip flags are the easy part to find and address nothing embedded during compilation. SOURCE_DATE_EPOCH is a convention rather than a mechanism, and tar, gzip and ar ignore it entirely. gzip embeds the input filename as well as its mtime unless given -n, and tar -z offers no way to pass that, so the archive has to be piped. The debug prefix map that covers only debug info is not the one that also covers __FILE__. And the degenerate answers -- emptying the bundle, discarding debug information, hardcoding the artifact, or committing a built copy and installing that -- all achieve byte equality and are all rejected by the other three criteria. Measured with the real verifier: the project as shipped scores zero, the reference solution scores one, and each of the eleven single-fix regressions, the four degenerate strategies and the three completeness violations scores zero."
solution_explanation = "The insight is methodological before it is technical: stop trusting a local A-versus-B build in one place and construct a differ that varies the environment. The competent path is a short harness that builds the tree twice under a deliberately different directory, clock, source-file timestamp set, locale, timezone, umask, account and file-creation order, then unpacks both bundles and compares member metadata -- order, mtime, mode, uid, gid, user name, group name -- and member contents, rather than only the top-level digest. faketime, setpriv, unshare and the en_US.UTF-8 locale are installed for exactly this. With that harness each remaining leak announces itself; without it the work is guesswork, and a build that is reproducible only against the differences the solver happened to test is not reproducible. With the differ in place the fix proceeds outward through the layers. Derive a fixed epoch from something in the tree -- the release date in CHANGELOG.md -- rather than from the clock, and export it as SOURCE_DATE_EPOCH so the compiler uses it for __DATE__ and __TIME__. Take the generated header's date from that same epoch and replace the account and machine name with fixed strings. Add -ffile-prefix-map for the current directory so neither the debug information nor __FILE__ carries the absolute build path. Pin collation to the C locale at both places that sort: the manifest generator and the file list fed to tar. Package with an explicit sorted member list, a fixed mtime taken from the epoch, owner and group forced to zero with numeric ownership, and a mode mask that clears the group and other write bits so the caller's umask cannot reach the archive. Then pipe into gzip with -n so the stream carries neither the input file's name nor its timestamp. Finally re-run the differ across several combinations rather than one, confirm the bundle still contains every member, that the binary still has its debug information, and that the CLI still behaves. A qualified expert needs about three to four hours: roughly one to build the differ, an hour and a half to find and fix the eleven leaks, and the remainder on verification."
verification_explanation = "The agent writes no answer file. It modifies the build definition in place and the verifier builds the tree itself, so the graded object is the behaviour of the build rather than the shape of the patch -- many different correct Makefiles pass, which is the right acceptance criterion because reproducibility is a property of the output. Three builds run inside the verifier, all deterministic, none of them visible to the agent. Environment A uses a shallow path, the C locale, UTC, umask 022, a fixed clock and the root account. Environment B uses a deep path, en_US.UTF-8, Australia/Adelaide, umask 002, a clock nearly six years later, an unprivileged account in a private UTS namespace with a different machine name, source timestamps from a different month, and a tree materialised in the opposite order so directory reads differ. Environment C repeats A against a tree with one string in src/greet.c altered. Every copy has build/, stage/, dist/ and src/buildinfo.h removed before building, so a tree carrying stale outputs or a bundle committed by hand is rebuilt from source rather than graded as it stands -- an early version of this verifier did not do that, and reported the unmodified project as perfectly reproducible because make had nothing to do. Four criteria, all required. The bundles from A and B must have identical SHA-256 digests; there is no tolerance and none is appropriate, since reproducibility has exactly two states and byte equality is how the discipline defines success. The bundle from C must differ from A, which is what rejects a build that has stopped depending on its sources. The bundle must unpack into a single greet-VERSION directory containing all thirteen required members, and its binary must retain a .debug_info section. And the packaged CLI must still print the expected banner, salutation and uppercase salutation, the banner carrying the release date from the changelog rather than the day of the build. Criteria two through four are what separate a genuine fix from the degenerate ones, because an empty or frozen bundle satisfies the first trivially. One design point deserves stating: the instruction names the classes of variation, because that is the professional standard and withholding it would make the task a guessing game about the verifier, but the values are held out, so a solution tuned until one locally observed difference went quiet does not pass. Measured against the real entrypoint: the reference solution scores 1 and does so in about a second; the project as shipped scores 0; each of eleven single-fix regressions scores 0; stripping debug information, dropping the docs, changing the CLI's behaviour, emptying the bundle, making the build a no-op, and committing a pre-built bundle and copying it into place all score 0. The entrypoint is the hardened one: pytest runs from a fresh directory of its own with python -I, its config and conftest search pinned to the tests directory, the cache provider off, and both output files deleted before being written so a symlink left in their place is removed rather than followed."

