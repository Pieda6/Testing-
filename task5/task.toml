difficulty_explanation = "The minimum-weight spanning arborescence is the directed analogue of the minimum spanning tree, and it is working equipment rather than a curiosity: it is the decoding step in non-projective dependency parsing, where a parser scores every candidate head-dependent arc and then extracts the highest-scoring dependency tree with exactly this computation; it is minimum-cost broadcast design in networking, the cheapest way to reach every node from one source over links whose costs differ by direction; and it appears in phylogenetics for rooted-tree reconstruction from directed distances. NLP systems builders, network planners and computational biologists all meet it, and in each case the directed version is the one that arises naturally, because arc scores, link costs and evolutionary distances are rarely symmetric. The task asks for fifty instances to be solved and, crucially, proved. Three things make it hard. First the classic trap: taking the cheapest incoming edge at every vertex is what undirected intuition suggests and is wrong whenever those choices close a cycle, so Chu-Liu/Edmonds is needed, and its contraction step is genuinely easy to implement almost correctly -- collapse the cycle, re-weight entering edges against the cycle edge they displace, recurse because the reduced graph can contain another cycle, then drop exactly one cycle edge on expansion. Second, feasibility is not an in-degree test: a group of vertices can be mutually reachable while cut off from the root, and twelve instances are infeasible with eight of them of exactly that kind. Third, and the reason a library does not settle this, every answer must carry a certificate -- a dual solution proving no arborescence is cheaper, or a set with no entering edge proving none exists. Off-the-shelf routines return the tree and no proof; networkx.minimum_spanning_arborescence solves the whole battery in 0.3 seconds and scores zero here, because the dual has to be produced by understanding the algorithm rather than calling it. Every figure that follows is the number of the fifty instances whose primal answer a wrong implementation still gets right, measured on the shipped data; all of them additionally fail the proof. An undirected minimum spanning tree: 0. Cheapest incoming edge per vertex with the root given an incoming edge: 4; with self-loops not excluded: 7; done correctly but with no contraction at all: 8. Contracting without re-weighting: 19. Contracting a single level: 19. Dropping the wrong cycle edge on expansion: 20 -- that one reports the correct total weight on every instance while returning an edge set that is not an arborescence, so it is invisible to anyone checking only the number. Contracting two levels but not three: 31. Concluding an arborescence exists because every vertex has an incoming edge: 42. Sizing removes the brute-force routes on every instance: with 30 to 38 vertices, enumerating one incoming edge per vertex is 10^14 combinations at the smallest and 10^24 at the largest, and a subset DP would need 4.3 GB of state on the smallest against a 2 GB container. Grading is all-or-nothing across all fifty. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Discard self-loops and edges pointing at the root; neither can appear in an arborescence. Then run Chu-Liu/Edmonds: take each non-root vertex's cheapest remaining incoming edge, and if those choices form no cycle they are already optimal. Otherwise contract a cycle to a single vertex, giving each edge entering it at head v the reduced weight w minus the weight of the cycle edge arriving at v, and recurse, because the contracted graph can contain another cycle and that one another. On the way out, the sub-solution has exactly one edge entering the contracted vertex; keep every cycle edge except the one arriving at that edge's head. The real total is the sub-total plus the whole cycle weight, because the discount applied to the entering edge is exactly the weight of the edge it displaces. The certificate is the part that cannot be delegated to a library, and the insight is that the algorithm has already computed it: the amount subtracted from a vertex's incoming edges at each reduction step is precisely the dual value of the set that vertex currently represents, and the sets produced by successive contractions form a laminar family. Running the algorithm in its reduce-then-contract form makes the correspondence explicit -- record the pair of current vertex set and amount subtracted at every reduction, discard the zero entries, and that list is a dual solution whose value equals the weight of the arborescence. Infeasibility is certified more simply: the set of vertices not reachable from the root has no edge entering it, because any such edge would come from a reachable vertex and make its head reachable too. The reference implementation is pure standard-library Python, uses no randomness, and solves and proves all fifty instances in about 0.015 s, so the binding constraint is understanding the algorithm rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "Every answer carries its own proof and the proof is what is checked, so the verifier accepts any optimal arborescence with any valid certificate rather than one blessed edge set. For a feasible instance it re-examines the submitted edges against a trusted copy of the graph -- exactly n-1 edges, no self-loop, nothing entering the root, no two edges sharing a head, every vertex reachable from the root, weights summing to the reported total -- then checks the dual: every value non-negative, no set containing the root, and for every edge the total of the values over the sets that edge enters at most its weight, with the sum of all values equal to the weight of the arborescence. Since every spanning arborescence must contain an edge entering every non-empty non-root set, a dual-feasible y lower-bounds every arborescence, so matching that bound is a proof of optimality rather than evidence of it. For an infeasible instance the cut must be a non-empty set of non-root vertices with no edge entering it, which is a proof that nothing can reach them. The held-out optimum in tests/expected.json is checked as well, so an answer must be both provably optimal and equal to the known value. Both that file and the trusted copy of the graphs are overlaid only at verification time and are never in the agent's image; the copy matters because /app/data is writable by the agent. The schema is pinned strictly: exact field set, feasible a real JSON boolean rather than 0/1, integer weights and values, sorted unique vertex and edge lists, at most 5000 dual entries, and empty edges and dual with weight 0 for an infeasible instance. The result is read with O_NOFOLLOW so a symlinked path cannot alias another file. Grading is all-or-nothing across all fifty. The answer key was established three ways: the reference solver was differentially tested against exhaustive enumeration on 2500 small graphs and against an exact subset DP written in C on 400 larger ones with zero mismatches, and every shipped answer was then proved optimal in polynomial time by the same duality argument the verifier applies, using a checker that does not trust the solver. That checker was itself confirmed to reject a valid but suboptimal arborescence and to agree with the subset DP on every instance of a pilot battery. Measured against the real verifier: oracle 1.0 in 0.015 s and stable across re-runs; nop 0; symlinked output 0; and 0 for networkx.minimum_spanning_arborescence with the dual left empty and with the field omitted, for a dual with one value inflated, one entry dropped, one value negated, or a set containing the root, for an infeasible instance reported with an empty cut or with a cut an edge enters, and for a one-instance-off-by-one near miss, a reversed array, a dropped entry, reversed edge lists, everything reported infeasible, and feasible sent as 0/1. As a fairness check, networkx's arborescence -- a different optimum from the reference on many instances -- paired with a genuine dual scores 1.0, confirming the certificate grading does not privilege one optimal answer."

