[task]
name = "dynamo/arborescence-battery"
description = "Compute the minimum-weight spanning arborescence of fifty directed graphs, or determine that none exists."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Mathematics and Formal Reasoning"
subcategory = "Algorithms and Optimization theory"
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"
