task_objective = ["optimize"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 3.0
difficulty_explanation = "The minimum-weight spanning arborescence is the directed analogue of the minimum spanning tree, and the analogy is a trap: taking the cheapest incoming edge at every vertex is the obvious construction, is what the undirected intuition suggests, and is wrong whenever those choices close a cycle. Getting it right needs Chu-Liu/Edmonds, whose contraction step is genuinely easy to implement almost correctly -- the cycle is collapsed, entering edges are re-weighted against the cycle edge they would displace, the reduced graph is solved, and expansion drops exactly one cycle edge. Each of those four steps is a place to be subtly wrong, and the fifty instances are selected so that each mistake is fatal rather than survivable: fifteen require contraction to recurse three or more levels, ten require two, eleven require one, and ten have no arborescence at all. Every figure that follows is the number of the fifty instances that a wrong implementation still gets right, measured against the real verifier on the shipped data. An undirected minimum spanning tree: 0. Cheapest incoming edge per vertex with no contraction: 8; the same with self-loops not excluded: 5; the same but also giving the root an incoming edge: 4. Contracting without re-weighting the entering edges: 15. Contracting a single level: 20. Dropping the wrong cycle edge on expansion: 22. Assuming weights are non-negative: 28. Contracting two levels but not three: 32. Concluding an arborescence exists because every vertex has an incoming edge: 44 -- that one fails only on the six instances where a group of vertices is mutually reachable but cut off from the root, which is exactly the case an in-degree check cannot see. Sizing removes the escape routes: with 30 to 38 vertices, enumerating one incoming edge per vertex is 10^14 combinations on the smallest instance and 10^24 on the largest, and an exact subset DP would need 4.3 GB of state on the smallest instance against a 2 GB container, so neither brute-force route is available anywhere in the battery. Grading is all-or-nothing across all fifty, so a single mishandled contraction scores 0. The data is synthetic, generated deterministically from a fixed seed."
solution_explanation = "Discard self-loops and edges pointing at the root; neither can appear in an arborescence, since a vertex cannot be its own parent and the root has no parent. Then run Chu-Liu/Edmonds. Choose the cheapest remaining incoming edge for every non-root vertex; if some vertex has none, no arborescence exists. If those choices form no cycle they are already optimal. Otherwise take a cycle, and note the key exchange argument: an optimal arborescence uses exactly one edge entering the cycle, and choosing it displaces exactly one of the cycle's own edges. So collapse the cycle to a single vertex and give every edge entering it, at head v, the reduced weight w minus the weight of the cycle edge arriving at v -- the improvement over what is already there. Solve the smaller graph the same way, recursively, because the contracted graph can contain another cycle and that one another again. On the way back out, the sub-solution contains exactly one edge entering the contracted vertex; keep every cycle edge except the one arriving at that edge's head. The real total is the sub-total plus the whole cycle weight, because the discount applied to the entering edge is exactly the weight of the cycle edge it displaces and the two corrections cancel. Nothing assumes non-negative weights. Infeasibility falls out of the recursion rather than an in-degree test: a group of vertices reachable only from each other survives every reduction and eventually leaves a vertex with no incoming edge. The reference implementation is pure standard-library Python, uses no randomness, and solves all fifty instances in under a millisecond, so the binding constraint is getting the algorithm right rather than the clock, and a wrong answer is a finished wrong answer rather than a timeout."
verification_explanation = "Correctness is checked by certificate rather than by string-matching one blessed answer, so an instance with several optimal arborescences accepts any of them. For each instance the verifier re-examines the submitted edge set against the graph: exactly n-1 edges, no self-loop, nothing pointing at the root, no two edges sharing a head, every vertex reachable from the root, and weights summing to the total claimed -- then requires that total to equal the true optimum, held in tests/expected.json. Both that file and a trusted copy of the graphs are overlaid only at verification time and are never in the agent's image; the copy matters because /app/data is writable by the agent, so the verifier reads the graphs from tests/ instead. The output schema is pinned strictly: exact field set, feasible a real JSON boolean rather than 0/1, total_weight a plain integer, edges a sorted list of unique non-negative ids, and weight 0 with no edges when no arborescence exists. The result is read with O_NOFOLLOW so a symlinked output path cannot alias another file. Grading is all-or-nothing across all fifty. The answer key itself was established three ways. The reference solver was differentially tested against exhaustive enumeration on 2500 small graphs and against an exact subset DP written in C on 400 larger ones, with zero mismatches. Every shipped answer is then proved optimal in polynomial time by LP duality on the arborescence polytope: the dual solution Chu-Liu/Edmonds produces as a by-product is checked for non-negativity and dual feasibility on every edge, and its value is checked to equal the weight of the arborescence, which leaves no duality gap and so admits no cheaper arborescence. That check does not trust the solver -- a wrong answer would show up as an infeasible dual or a gap -- and it was itself confirmed to reject a valid but suboptimal arborescence and to agree with the subset DP on every instance of a smaller pilot battery. Measured against the real verifier: oracle 1.0 in under 0.05 s and stable across re-runs, nop 0, and 0 for each of the ten wrong implementations quoted above plus a one-instance-off-by-one near miss, a reversed array, a dropped entry, reversed edge lists, everything reported infeasible, feasible sent as 0/1, an edge swapped for another real edge, and a symlinked output path."

